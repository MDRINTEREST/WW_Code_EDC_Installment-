*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6}
.hero{background:var(--head-bg);color:var(--head-ink)}
.hero .in{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 22px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}

.meta{color:var(--muted);font-size:.88rem}
.hero .meta{color:var(--head-sub);font-size:.9rem}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.rail{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.step{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:500;font-size:1.02rem;margin-bottom:8px;color:var(--ink)}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--sel-bg);color:var(--sel-ink);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}

.seg button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink);font-weight:500}
.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.banks button .bt span{font-family:var(--f-head);font-weight:500;font-size:.92rem}
.banks button small{color:var(--muted);font-size:.74rem;font-weight:400}
.banks button[aria-pressed="true"]{border-color:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel-bg);background:var(--soft)}
.banks button.exp{opacity:.55}

.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo.lg{width:128px;max-width:128px;height:56px;border:1px solid var(--line);border-radius:12px;padding:6px 10px}

.badge.lg{width:56px;height:56px;font-size:.95rem;border-radius:12px}
button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue-hi);outline-offset:2px}

.bankhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

function badge(b,lg){if(LOGO[b]){const w=el('span','logo'+(lg?' lg':''));const im=document.createElement('img');im.src=LOGO[b];im.alt=b;w.append(im);return w}const d=BADGE[b];const e=el('span','badge'+(lg?' lg':''),d?d[0]:b.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'•');if(d){e.style.background=d[1];e.style.color=d[2]}e.setAttribute('aria-hidden','true');return e}
const products=uniq(DATA.rows.map(r=>r.product));
let st={product:store.get('edc.p'),purch:store.get('edc.t')||PURCH[0],bank:store.get('edc.b')};
if(!products.includes(st.product))st.product=products[0];
if(!PURCH.includes(st.purch))st.purch=PURCH[0];

$('meta').textContent='ข้อมูลเดือน '+(DATA.label||'-')+(DATA.updated?' · อัปเดต '+thDate(DATA.updated):'');

function rowsFor(){return DATA.rows.filter(r=>r.product===st.product&&(r.purchase===st.purch||r.purchase===BOTH))}
function info(p,b){return DATA.info.find(i=>i.product===p&&i.bank===b)}

function segs(host,items,cur,onPick){host.replaceChildren(...items.map(it=>{const b=el('button',null,it);b.type='button';b.setAttribute('aria-pressed',String(it===cur));b.onclick=()=>onPick(it);return b}))}

function render(){
  segs($('prod'),products,st.product,v=>{st.product=v;store.set('edc.p',v);render()});
  segs($('purch'),PURCH,st.purch,v=>{st.purch=v;store.set('edc.t',v);render()});
  const rows=rowsFor(); const banks=uniq(rows.map(r=>r.bank));
  if(!banks.includes(st.bank))st.bank=banks[0];
  $('banks').replaceChildren(...banks.map(b=>{const i=info(st.product,b)||{};const s=status(i.start,i.end);
    const bt=el('button',s.exp?'exp':null);bt.type='button';bt.setAttribute('aria-pressed',String(b===st.bank));
    const m=b.match(/^(.*?)\s*\((.*)\)$/);const tx=el('span','bt');tx.title=b;tx.append(el('span',null,m?m[1]:b),el('small',null,s.t.replace('ใช้ได้ถึง','ถึง')));bt.append(badge(b),tx);bt.onclick=()=>{st.bank=b;store.set('edc.b',b);render();$('result').scrollIntoView({block:'start',behavior:'smooth'})};return bt}));
  renderResult(rows.filter(r=>r.bank===st.bank));
}

function copyBtn(v){const b=el('button','copy','คัดลอก');b.type='button';b.onclick=async()=>{try{await navigator.clipboard.writeText(v);b.textContent='คัดลอกแล้ว'}catch(e){const r=document.createRange();r.selectNodeContents(b.previousSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='เลือกข้อความแล้ว'}setTimeout(()=>b.textContent='คัดลอก',1600)};return b}

function renderResult(rows){
  const R=$('result'); R.replaceChildren();
  if(!st.bank||!rows.length){R.append(el('div','empty','ไม่มีโปรผ่อนสำหรับตัวเลือกนี้'));return}
  const i=info(st.product,st.bank)||{}; const s=status(i.start,i.end);
  const head=el('div','bankhead'); const bh=el('div','bh'); bh.append(el('h2',null,st.bank)); if(i.period)bh.append(el('span','meta','ระยะเวลาโปร '+i.period)); head.append(badge(st.bank,true),bh,el('span','chip '+s.cls,s.t));
  R.append(head);
  if(s.exp&&s.cls==='bad')R.append(el('div','warnbox','โปรของธนาคารนี้หมดเขตตามวันที่ในไฟล์แล้ว ตรวจสอบกับ HQ ก่อนใช้รหัส'));
  // group by term
  const groups=new Map();
  for(const r of rows){const k=[r.months,r.cond,r.rate].join('|');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
  const J=el('nav','jump');J.setAttribute('aria-label','ไปที่จำนวนเดือน');R.append(J);let gi=0;
  for(const [,g] of groups){
    const f=g[0]; const t=el('article','term'+(s.exp?' dim':'')); t.id='t'+(gi++);
    const a=el('a',null,f.months+(f.cond?' '+f.cond:''));a.href='#'+t.id;a.onclick=ev=>{ev.preventDefault();t.scrollIntoView({block:'start',behavior:'smooth'})};J.append(a);
    const L=el('div','left'); const mo=el('div','mo',String(f.months)); mo.append(el('span',null,'เดือน')); L.append(mo);
    if(f.cond)f.cond.split(' · ').forEach(c=>L.append(el('span','chip',c)));
    if(f.rate)L.append(el('span','chip warn','ดอกเบี้ย '+f.rate+'/เดือน'));
    const Rt=el('div','right');
    const cbs=uniq(g.map(x=>x.cashback).filter(Boolean));
    if(cbs.length){const c=el('div','cb','เครดิตเงินคืน: ');c.append(el('b',null,cbs.join(' / ')));Rt.append(c)}
    for(const r of g){
      const c=el('div','card'); c.append(el('div','cn',r.card));
      const P=el('div','parts');
      r.codes.forEach(([lab,val])=>{const p=el('div','part');p.append(el('span','pl',lab));const v=el('div','pv');
        if(val){v.append(el('span','code',val),copyBtn(val))}else{v.append(el('span','chip bad','ไม่มีรหัส – ติดต่อ HQ'))}
        p.append(v);P.append(p)});
      c.append(P);
      if(r.note){r.note.split(' / ').forEach(n=>c.append(el('div',n.startsWith('⚠')?'warnbox':'note',n)))}
      Rt.append(c);
    }
    t.append(L,Rt); R.append(t);
  }
  if(i.details){const d=el('details','terms');d.append(el('summary',null,'เงื่อนไขเครดิตเงินคืน / วิธีลงทะเบียนของ '+st.bank),el('pre',null,i.details));R.append(d)}
}
render();

/* ---------- HQ update ---------- */
const COLS=['สินค้า','ธนาคาร','รูปแบบการซื้อ','งวด (เดือน)','เงื่อนไขงวด','ดอกเบี้ย/เดือน','เครดิตเงินคืน','ประเภทบัตร','ชื่อรหัส 1','รหัส 1','ชื่อรหัส 2','รหัส 2','ชื่อรหัส 3','รหัส 3','หมายเหตุ','วันเริ่ม','วันสิ้นสุด','ที่มา (ไฟล์เดิม)'];
const ICOLS=['สินค้า','ธนาคาร','ระยะเวลา (ข้อความ)','วันเริ่ม','วันสิ้นสุด','รายละเอียดเครดิตเงินคืน / วิธีลงทะเบียน'];
let pending=null, artifactNS=null, downloadsNS=null;

function iso(v){if(v==null||v==='')return '';if(v instanceof Date){const d=new Date(v.getTime()+12*3600e3);return d.toISOString().slice(0,10)}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){let y=+m[3];if(y>2400)y-=543;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
function readSheet(wb,name){const ws=wb.Sheets[name];if(!ws)return null;
  return {text:XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}),raw:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}}
function parseMaster(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true}); const errs=[],warns=[];
  const a=readSheet(wb,'Code EDC'); if(!a){return {errs:['ไม่พบชีต "Code EDC" ในไฟล์']}}
  const h=a.text[0].map(x=>String(x).trim()); const ix={}; COLS.forEach(c=>{ix[c]=h.indexOf(c)});
  const miss=COLS.slice(0,17).filter(c=>ix[c]<0); if(miss.length)return {errs:['ชีต "Code EDC" ไม่มีคอลัมน์: '+miss.join(', ')]};
  const rows=[];
  for(let r=1;r<a.text.length;r++){const T=a.text[r],W=a.raw[r];const g=c=>String(T[ix[c]]??'').trim();
    if(!g('สินค้า')&&!g('ธนาคาร'))continue;
    const n=r+1; const months=parseInt(g('งวด (เดือน)'),10);
    let pur=g('รูปแบบการซื้อ'); if(![...PURCH,BOTH].includes(pur)){warns.push(`แถว ${n}: รูปแบบการซื้อ "${pur}" ไม่ตรงตัวเลือก ใช้ "${BOTH}" แทน`);pur=BOTH}
    if(!g('สินค้า')||!g('ธนาคาร')||!g('ประเภทบัตร'))errs.push(`แถว ${n}: ต้องมี สินค้า, ธนาคาร และ ประเภทบัตร`);
    if(isNaN(months))errs.push(`แถว ${n}: งวด (เดือน) ต้องเป็นตัวเลข`);
    const codes=[];for(const k of [1,2,3]){const l=g('ชื่อรหัส '+k),v=g('รหัส '+k);if(l||v)codes.push([l||'รหัส',v])}
    if(!codes.length||codes.every(c=>!c[1]))warns.push(`แถว ${n}: ${g('ธนาคาร')} ${months} เดือน ไม่มีรหัส`);
    codes.forEach(c=>{if(/e\+/i.test(c[1]))errs.push(`แถว ${n}: รหัส "${c[1]}" ถูก Excel แปลงเป็นเลขยกกำลัง ให้ตั้งเซลล์เป็น Text แล้วพิมพ์ใหม่`)});
    const s=iso(W[ix['วันเริ่ม']]),e=iso(W[ix['วันสิ้นสุด']]);
    if(s===null||e===null)errs.push(`แถว ${n}: อ่านวันเริ่ม/วันสิ้นสุดไม่ได้ (ใช้รูปแบบวันที่ของ Excel)`);
    rows.push({product:g('สินค้า'),bank:g('ธนาคาร'),purchase:pur,months,cond:g('เงื่อนไขงวด'),rate:g('ดอกเบี้ย/เดือน'),cashback:g('เครดิตเงินคืน'),card:g('ประเภทบัตร'),codes,note:g('หมายเหตุ'),start:s||'',end:e||'',src:ix['ที่มา (ไฟล์เดิม)']>=0?g('ที่มา (ไฟล์เดิม)'):''});
  }
  const info=[]; const b=readSheet(wb,'เงื่อนไขธนาคาร');
  if(b){const h2=b.text[0].map(x=>String(x).trim());const j={};ICOLS.forEach(c=>{j[c]=h2.indexOf(c)});
    for(let r=1;r<b.text.length;r++){const T=b.text[r],W=b.raw[r];const g=c=>j[c]<0?'':String(T[j[c]]??'').trim();if(!g('สินค้า'))continue;
      info.push({product:g('สินค้า'),bank:g('ธนาคาร'),period:g('ระยะเวลา (ข้อความ)'),start:iso(W[j['วันเริ่ม']])||'',end:iso(W[j['วันสิ้นสุด']])||'',details:g('รายละเอียดเครดิตเงินคืน / วิธีลงทะเบียน')})}}
  else warns.push('ไม่พบชีต "เงื่อนไขธนาคาร" หน้าเว็บจะไม่แสดงช่วงเวลาและเงื่อนไขของธนาคาร');
  // fill bank period from rows where info missing
  const keys=new Set(info.map(i=>i.product+'|'+i.bank));
  for(const r of rows){const k=r.product+'|'+r.bank;if(!keys.has(k)){keys.add(k);info.push({product:r.product,bank:r.bank,period:'',start:r.start,end:r.end,details:''})}}
  let label=DATA.label; const c=wb.Sheets['วิธีอัปเดต']; if(c&&c['B1']&&c['B1'].w)label=String(c['B1'].w).trim();
  if(!rows.length)errs.push('ไม่พบแถวข้อมูลในชีต "Code EDC"');
  return {errs,warns,data:{label,updated:TODAY,rows,info}};
}
function showCheck(res){
  const C=$('check');C.replaceChildren();$('pub').hidden=true;pending=null;
  if(res.errs&&res.errs.length){const d=el('div','warnbox','แก้ไฟล์ก่อนเผยแพร่:');const u=el('ul');res.errs.slice(0,15).forEach(x=>u.append(el('li',null,x)));d.append(u);C.append(d);return}
  const D=res.data; const ps=uniq(D.rows.map(r=>r.product));
  const ok=el('div','status');ok.textContent=`อ่านได้ ${D.rows.length} แถว · ข้อมูลเดือน ${D.label} · สินค้า: ${ps.join(', ')} · ธนาคาร ${uniq(D.rows.map(r=>r.bank)).length} แห่ง`;C.append(ok);
  const exp=D.info.filter(i=>i.end&&i.end<TODAY);if(exp.length)res.warns.push('หมดเขตแล้วตามวันที่ในไฟล์: '+exp.map(i=>i.product+' – '+i.bank).join(', '));
  if(res.warns.length){const d=el('div','warnbox','ตรวจสอบ (เผยแพร่ได้):');const u=el('ul');res.warns.slice(0,20).forEach(x=>u.append(el('li',null,x)));if(res.warns.length>20)u.append(el('li',null,`และอีก ${res.warns.length-20} รายการ`));d.append(u);C.append(d)}
  pending=D;$('pub').hidden=!(artifactNS||STANDALONE);
}
function buildDoc(data){
  const reset=(document.head.querySelector('style')||{}).textContent||'';
  const json=JSON.stringify(data).replace(/</g,'\\u003c');
  const parts=[
    '<title>'+document.title+'</title>',
    '\n'+document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]').outerHTML,
    '\n<style id="appcss">'+$('appcss').textContent+'</style>',
    '\n'+$('shell').outerHTML,
    '\n<div id="app"></div>',
    '\n<script id="data" type="application/json">'+json+'<\/script>',
    '\n<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>',
    '\n<script id="appjs">'+$('appjs').textContent+'<\/script>\n'];
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+parts.join('')+'</body></html>';
}
function toWorkbook(data){
  const wb=XLSX.utils.book_new();
  const A=[COLS,...data.rows.map(r=>{const c=[...r.codes,['',''],['',''],['','']];return [r.product,r.bank,r.purchase,r.months,r.cond,r.rate,r.cashback,r.card,c[0][0],c[0][1],c[1][0],c[1][1],c[2][0],c[2][1],r.note,r.start,r.end,r.src||'']})];
  const ws=XLSX.utils.aoa_to_sheet(A);
  for(let i=1;i<A.length;i++)for(const col of [9,11,13]){const ref=XLSX.utils.encode_cell({r:i,c:col});if(ws[ref]){ws[ref].t='s';ws[ref].z='@'}}
  ws['!cols']=[24,22,24,10,14,12,26,32,22,16,18,16,16,12,50,12,12,30].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,'Code EDC');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([ICOLS,...data.info.map(i=>[i.product,i.bank,i.period,i.start,i.end,i.details])]),'เงื่อนไขธนาคาร');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['เดือนข้อมูล',data.label],[],['แก้ชีต Code EDC แล้วอัปโหลดผ่านปุ่ม "อัปเดตข้อมูล (HQ)" บนหน้าเว็บ ห้ามเปลี่ยนชื่อหัวคอลัมน์และชื่อชีต'],['วันที่ใส่เป็น ปปปป-ดด-วว (ค.ศ.) หรือวันที่ของ Excel']]),'วิธีอัปเดต');
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}
const STANDALONE=!(window.claude&&window.claude.use);
function saveBlob(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function wireFile(){$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('status').textContent='';
    if(typeof XLSX==='undefined'){$('status').textContent='โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า';return}
    try{showCheck(parseMaster(await f.arrayBuffer()))}catch(err){showCheck({errs:['อ่านไฟล์ไม่ได้: '+err.message]})}}}
function standaloneHQ(){
  if(!STANDALONE||location.hash!=='#hq'||!$('admin').hidden)return;
  $('admin').hidden=false;$('admin').open=true;
  $('admin').querySelector('summary').textContent='อัปเดตข้อมูล (HQ) – สร้างไฟล์เว็บฉบับใหม่';
  $('admin').querySelector('p.note').textContent='1) เลือกไฟล์ Master Excel ที่แก้แล้ว  2) ตรวจสรุป  3) กด "สร้างไฟล์เว็บใหม่" จะได้ไฟล์ code-edc.html  4) นำไฟล์นั้นไปอัปโหลดทับไฟล์เดิมบนเว็บไซต์ สาขาเปิดลิงก์เดิมก็เห็นข้อมูลใหม่';
  $('pub').textContent='สร้างไฟล์เว็บใหม่ (code-edc.html)';
  wireFile();
  $('pub').onclick=()=>{if(!pending)return;saveBlob('code-edc.html',buildDoc(pending),'text/html');$('status').textContent='ดาวน์โหลดไฟล์ code-edc.html แล้ว นำไปอัปโหลดทับไฟล์เดิมบนเว็บไซต์ได้เลย'};
  $('dl').onclick=()=>{if(typeof XLSX==='undefined'){$('status').textContent='โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ';return}saveBlob('Master_Code_EDC_'+String(DATA.label).replace(/\s+/g,'')+'.xlsx',toWorkbook(DATA),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')};
}
standaloneHQ(); window.addEventListener('hashchange',standaloneHQ);
(async()=>{
  if(STANDALONE)return;
  const user=await window.claude.use('user').catch(()=>null);
  const canEdit=user?await user.canEdit().catch(()=>false):false;
  if(!canEdit)return;
  artifactNS=await window.claude.use('artifact').catch(()=>null);
  downloadsNS=await window.claude.use('downloads').catch(()=>null);
  $('admin').hidden=false; $('dl').hidden=!downloadsNS || typeof XLSX==='undefined';
  wireFile();
  $('pub').onclick=async()=>{if(!pending||!artifactNS)return;const b=$('pub');b.disabled=true;$('status').textContent='กำลังเผยแพร่…';
    try{await artifactNS.publish(buildDoc(pending));$('status').textContent='เผยแพร่แล้ว ทุกสาขาจะเห็นข้อมูลใหม่'}
    catch(err){const c=err&&err.code;$('status').textContent=c==='conflict'?'มีคนอัปเดตก่อนหน้านี้ หน้ากำลังโหลดเวอร์ชันล่าสุด ลองใหม่อีกครั้ง':(c==='not_writer'||c==='not_granted')?'บัญชีนี้ไม่มีสิทธิ์แก้หน้านี้ ขอสิทธิ์ Editor จากเจ้าของลิงก์':'เผยแพร่ไม่สำเร็จ ('+(c||'error')+') ลองอีกครั้งภายหลัง';b.disabled=false}};
  $('dl').onclick=async()=>{try{await downloadsNS.save({filename:'Master_Code_EDC_'+String(DATA.label).replace(/\s+/g,'')+'.xlsx',data:toWorkbook(DATA)})}catch(err){if(err&&err.code!=='declined')$('status').textContent='ดาวน์โหลดไม่สำเร็จ ('+(err.code||'error')+')'}};
})();
})();
</script>
